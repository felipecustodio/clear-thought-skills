name: Release & Publish Skills

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Validate and Publish Skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python
        run: uv python install

      - name: Verify lockfile
        run: just check-lock

      - name: Install dependencies
        run: just sync

      - name: Run lint, type, test, and skill validation checks
        run: just check

      - name: Publish Skills via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skill publish --tag v1.0.${{ github.run_number }}
