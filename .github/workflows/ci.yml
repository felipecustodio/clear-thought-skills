name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint type test skill-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python
        run: uv python install

      - name: Verify lockfile
        run: just check-lock

      - name: Install dependencies
        run: just sync

      - name: Lint
        run: just lint

      - name: Type check
        run: just type

      - name: Test
        run: just test

      - name: Validate skills
        run: just validate-skills
